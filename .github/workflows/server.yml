name: Server checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: luffi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d luffi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LUFFI_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/luffi_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Test server and real PostgreSQL
        run: npm test --prefix server
